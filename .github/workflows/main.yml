name: Build Antitap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android shell
        run: flutter create --platforms android --org com.sayvoi --project-name antitap .

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Antitap"#' "$M"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: antitap-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
